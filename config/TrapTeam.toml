# XenonRecomp config for Skylanders: Trap Team (Xbox 360, title 41560911, the Europe disc).
# Helper addresses from tools/sigmatch (all confidence 1.0, SSA's and Giants' inventories agree); functions and switch
# tables from tools/find_switch_tables.py (pass 1 without, pass 2 with the pass-1 mapping, merged). Paths are relative to
# this file laid out as the kit does (config/TrapTeam.toml, private/default.xex, ppc/): Arkeyan-Builder builds that layout from
# the player's disc. Output: ppc/ (private/trapteam/ppc in the workshop).
[main]
file_path = "../private/default.xex"
out_directory_path = "../ppc"
switch_table_file_path = "TrapTeam_switch_tables.toml"

skip_lr = false
skip_msr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
cr_as_local = false
non_argument_as_local = false
non_volatile_as_local = false

restgprlr_14_address = 0x827ABFD0
savegprlr_14_address = 0x827ABF80
restfpr_14_address = 0x827ACC1C
savefpr_14_address = 0x827ACBD0
restvmx_14_address = 0x827AC938
