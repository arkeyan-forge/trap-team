longjmp_address = 0x827AA680
setjmp_address = 0x827D51A0

invalid_instructions = [
    { data = 0x00000000, size = 4 }, # Padding
    { data = 0x827ACE58, size = 8 }, # __CxxFrameHandler + FuncInfo, before C++ EH functions (237 sites)
    { data = 0x827E1F60, size = 8 }, # __C_specific_handler (import thunk) + scope table, before SEH functions (60 sites)
    { data = 0x827BA230, size = 8 }, # custom handler + null data, before 0x827BA20C
]

